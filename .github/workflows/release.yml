name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test CompareVPN.Tools.IspChecker.Tests/CompareVPN.Tools.IspChecker.Tests.csproj -c Release
      - run: dotnet publish CompareVPN.ISPLookup/CompareVPN.ISPLookup.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: comparevpn-tools
          path: artifacts/
